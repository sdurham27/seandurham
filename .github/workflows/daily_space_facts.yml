name: Daily Space Fact

on:
  schedule:
    # Runs every day at 09:00 UTC — adjust to your preferred time
    - cron: "0 9 * * *"
  workflow_dispatch: # also allows manual runs from the GitHub Actions tab

jobs:
  post-space-fact:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r instagram_bot/requirements.txt

      - name: Install fonts
        run: sudo apt-get install -y fonts-dejavu-core

      - name: Generate and post space fact
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # Uncomment if your account requires a publicly reachable image URL:
          # IMAGE_PUBLIC_URL: ${{ secrets.IMAGE_PUBLIC_URL }}
        run: python instagram_bot/space_facts_bot.py
