<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saint Dizzie — Logo Concept</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@200;300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1b22;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 52px;
      padding: 72px 40px;
    }

    .page-label {
      color: #eee8dc;
      font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
      font-weight: 200;
      font-size: 11px;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      opacity: 0.35;
    }

    .logos {
      display: flex;
      gap: 72px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .logo-label {
      color: #eee8dc;
      font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
      font-weight: 200;
      font-size: 10px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      opacity: 0.28;
    }

    .saint-text {
      font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
      font-weight: 300;
      font-size: 27px;
      letter-spacing: 11px;
    }

    .dizzie-text {
      font-family: 'Bebas Neue', Impact, 'Arial Black', sans-serif;
      font-size: 118px;
      letter-spacing: 2px;
    }

    .mark-text {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 19px;
    }

    .footnote {
      color: #eee8dc;
      font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
      font-weight: 200;
      font-size: 11px;
      letter-spacing: 0.14em;
      line-height: 2.2;
      opacity: 0.28;
      text-align: center;
    }

    .small-size-demo {
      display: flex;
      gap: 32px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .size-label {
      color: #eee8dc;
      font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
      font-weight: 200;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.25;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <span class="page-label">Saint Dizzie — Logo Concept</span>

  <div class="logos">

    <!-- PRIMARY: DARK -->
    <div class="logo-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="340" height="340">
        <circle cx="250" cy="250" r="228" fill="#111318"/>
        <circle cx="250" cy="250" r="213" fill="none" stroke="#eee8dc" stroke-width="0.9"/>

        <!-- Flanking rules at SAINT cap midpoint -->
        <line x1="86"  y1="155" x2="158" y2="155" stroke="#eee8dc" stroke-width="0.7" opacity="0.65"/>
        <line x1="342" y1="155" x2="414" y2="155" stroke="#eee8dc" stroke-width="0.7" opacity="0.65"/>

        <text x="250" y="163" class="saint-text" text-anchor="middle" fill="#eee8dc">SAINT</text>

        <line x1="86" y1="178" x2="414" y2="178" stroke="#eee8dc" stroke-width="0.45" opacity="0.35"/>

        <text x="250" y="295" class="dizzie-text" text-anchor="middle" fill="#eee8dc">DIZZIE</text>

        <line x1="86" y1="315" x2="414" y2="315" stroke="#eee8dc" stroke-width="0.45" opacity="0.35"/>

        <text x="250" y="350" class="mark-text" text-anchor="middle" fill="#eee8dc" opacity="0.7">†</text>
      </svg>
      <span class="logo-label">Primary — Dark</span>
    </div>

    <!-- INVERSE: LIGHT -->
    <div class="logo-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="340" height="340">
        <circle cx="250" cy="250" r="228" fill="#eee8dc"/>
        <circle cx="250" cy="250" r="213" fill="none" stroke="#111318" stroke-width="0.9"/>

        <line x1="86"  y1="155" x2="158" y2="155" stroke="#111318" stroke-width="0.7" opacity="0.65"/>
        <line x1="342" y1="155" x2="414" y2="155" stroke="#111318" stroke-width="0.7" opacity="0.65"/>

        <text x="250" y="163" class="saint-text" text-anchor="middle" fill="#111318">SAINT</text>

        <line x1="86" y1="178" x2="414" y2="178" stroke="#111318" stroke-width="0.45" opacity="0.35"/>

        <text x="250" y="295" class="dizzie-text" text-anchor="middle" fill="#111318">DIZZIE</text>

        <line x1="86" y1="315" x2="414" y2="315" stroke="#111318" stroke-width="0.45" opacity="0.35"/>

        <text x="250" y="350" class="mark-text" text-anchor="middle" fill="#111318" opacity="0.7">†</text>
      </svg>
      <span class="logo-label">Inverse — Light</span>
    </div>

  </div>

  <!-- Small size validation -->
  <div>
    <div class="small-size-demo">
      <div>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="120" height="120">
          <circle cx="250" cy="250" r="228" fill="#111318"/>
          <circle cx="250" cy="250" r="213" fill="none" stroke="#eee8dc" stroke-width="0.9"/>
          <line x1="86"  y1="155" x2="158" y2="155" stroke="#eee8dc" stroke-width="0.7" opacity="0.65"/>
          <line x1="342" y1="155" x2="414" y2="155" stroke="#eee8dc" stroke-width="0.7" opacity="0.65"/>
          <text x="250" y="163" class="saint-text" text-anchor="middle" fill="#eee8dc">SAINT</text>
          <line x1="86" y1="178" x2="414" y2="178" stroke="#eee8dc" stroke-width="0.45" opacity="0.35"/>
          <text x="250" y="295" class="dizzie-text" text-anchor="middle" fill="#eee8dc">DIZZIE</text>
          <line x1="86" y1="315" x2="414" y2="315" stroke="#eee8dc" stroke-width="0.45" opacity="0.35"/>
          <text x="250" y="350" class="mark-text" text-anchor="middle" fill="#eee8dc" opacity="0.7">†</text>
        </svg>
        <p class="size-label">120px</p>
      </div>
      <div>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="72" height="72">
          <circle cx="250" cy="250" r="228" fill="#111318"/>
          <circle cx="250" cy="250" r="213" fill="none" stroke="#eee8dc" stroke-width="0.9"/>
          <line x1="86"  y1="155" x2="158" y2="155" stroke="#eee8dc" stroke-width="0.7" opacity="0.65"/>
          <line x1="342" y1="155" x2="414" y2="155" stroke="#eee8dc" stroke-width="0.7" opacity="0.65"/>
          <text x="250" y="163" class="saint-text" text-anchor="middle" fill="#eee8dc">SAINT</text>
          <line x1="86" y1="178" x2="414" y2="178" stroke="#eee8dc" stroke-width="0.45" opacity="0.35"/>
          <text x="250" y="295" class="dizzie-text" text-anchor="middle" fill="#eee8dc">DIZZIE</text>
          <line x1="86" y1="315" x2="414" y2="315" stroke="#eee8dc" stroke-width="0.45" opacity="0.35"/>
          <text x="250" y="350" class="mark-text" text-anchor="middle" fill="#eee8dc" opacity="0.7">†</text>
        </svg>
        <p class="size-label">72px</p>
      </div>
      <div>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="48" height="48">
          <circle cx="250" cy="250" r="228" fill="#111318"/>
          <circle cx="250" cy="250" r="213" fill="none" stroke="#eee8dc" stroke-width="0.9"/>
          <text x="250" y="295" class="dizzie-text" text-anchor="middle" fill="#eee8dc">DIZZIE</text>
        </svg>
        <p class="size-label">48px</p>
      </div>
    </div>
  </div>

  <p class="footnote">
    Bebas Neue (DIZZIE) &nbsp;·&nbsp; Barlow Condensed 300 (SAINT)<br>
    #111318 near-black &nbsp;·&nbsp; #eee8dc warm cream &nbsp;·&nbsp; no other colors<br>
    Prints clean on black or white merch at any size
  </p>

</body>
</html>
