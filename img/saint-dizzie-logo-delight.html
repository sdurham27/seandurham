<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saint Dizzie — Delight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@200;300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0e0f14;
      color: #ede8dc;
      font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
      overflow-x: hidden;
    }

    /* ============================================================
       ANIMATIONS
    ============================================================ */

    /* Text content group: materializes before the circle draws */
    @keyframes emerge-content {
      from { opacity: 0; transform: scale(0.93) translateY(8px); }
      to   { opacity: 1; transform: scale(1)    translateY(0); }
    }

    /* Circle ring: draws clockwise from 12 o'clock */
    @keyframes draw-circle {
      to { stroke-dashoffset: 0; }
    }

    /* Wordmark section: simple fade-lift */
    @keyframes emerge {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Triple-click glitch easter egg */
    @keyframes glitch {
      0%   { filter: none;              transform: none; }
      10%  { filter: invert(1);         transform: translateX(-2px); }
      22%  { filter: none;              transform: translateX(2px); }
      36%  { filter: invert(1) hue-rotate(20deg); transform: translateX(-1px); }
      52%  { filter: none;              transform: none; }
      66%  { filter: invert(0.55);      transform: translateX(1px); }
      80%  { filter: none;              transform: none; }
      100% { filter: none;              transform: none; }
    }

    /* ============================================================
       GRAIN OVERLAY
    ============================================================ */
    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
    }

    /* ============================================================
       LAYOUT
    ============================================================ */
    .badge-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
    }

    @media (max-width: 620px) {
      .badge-split { grid-template-columns: 1fr; min-height: unset; }
    }

    .badge-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 72px 40px;
      min-height: 60vh;
      /* Crosshair: signals interactivity without explaining it */
      cursor: crosshair;
    }

    .badge-dark  { background: #0e0f14; }
    .badge-light { background: #ede8dc; }

    /* Subtle scale on hover — badge feels alive */
    .badge-panel svg {
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .badge-panel:hover svg {
      transform: scale(1.016);
    }

    /* Glitch easter egg: applied via JS on triple-click */
    .badge-panel.glitching {
      animation: glitch 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ============================================================
       SVG INTERNALS
    ============================================================ */

    /* Text group: materializes first in the entrance sequence */
    .text-content {
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
    }
    .badge-dark  .text-content { animation: emerge-content 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.08s forwards; }
    .badge-light .text-content { animation: emerge-content 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.26s forwards; }

    /* Parallax layers: JS applies transforms, CSS provides transitions */
    .layer-saint, .layer-dizzie, .layer-mark {
      /* transition intentionally left to JS — different on move vs leave */
    }

    /* Badge ring: draws in after text appears */
    .badge-ring {
      transform-box: fill-box;
      transform-origin: center;
      transform: rotate(-90deg); /* start at 12 o'clock */
      stroke-dasharray: 1395;    /* circumference of r=222 */
      stroke-dashoffset: 1395;
    }
    .badge-dark  .badge-ring { animation: draw-circle 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.55s forwards; }
    .badge-light .badge-ring { animation: draw-circle 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.72s forwards; }

    /* Type styles (CSS so Google Fonts apply to inline SVG) */
    .saint-text {
      font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
      font-weight: 300;
      font-size: 32px;
      letter-spacing: 14px;
    }
    .dizzie-text {
      font-family: 'Bebas Neue', Impact, 'Arial Black', sans-serif;
      font-size: 144px;
      letter-spacing: 1px;
    }
    .mark-text {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 44px;
    }

    /* ============================================================
       LABELS
    ============================================================ */
    .panel-label {
      font-weight: 200;
      font-size: 10px;
      letter-spacing: 0.38em;
      text-transform: uppercase;
    }
    .panel-label-dark  { color: #ede8dc; opacity: 0.2; }
    .panel-label-light { color: #111318; opacity: 0.25; }

    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .logo-label {
      font-weight: 200;
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0;
    }
    .logo-label-dark  { color: #ede8dc; animation: emerge 0.4s ease 1.45s forwards; }
    .logo-label-light { color: #111318; animation: emerge 0.4s ease 1.62s forwards; }

    /* ============================================================
       WORDMARK SECTION
    ============================================================ */
    .section-wm {
      padding: 108px 40px 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
      border-top: 1px solid rgba(237,232,220,0.06);
    }

    .wm-label {
      font-weight: 200;
      font-size: 10px;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: #ede8dc;
      opacity: 0.18;
    }

    .wm-inner {
      text-align: center;
      opacity: 0;
      animation: emerge 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.18s forwards;
    }

    .wm-saint {
      display: block;
      font-weight: 200;
      font-size: 15px;
      letter-spacing: 22px;
      color: #ede8dc;
      opacity: 0.62;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    /* Wordmark: letters wrapped in spans for individual lift */
    .wm-dizzie {
      display: block;
      font-family: 'Bebas Neue', Impact, sans-serif;
      font-size: clamp(88px, 18vw, 182px);
      color: #ede8dc;
      letter-spacing: 2px;
      line-height: 0.88;
      cursor: default;
    }

    /* EQ bar lift: asymmetric heights suggest audio response, not mechanical wave */
    .wm-dizzie span {
      display: inline-block;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .wm-dizzie:hover span:nth-child(1) { transform: translateY(-6px);  transition-delay: 0.00s; }  /* D */
    .wm-dizzie:hover span:nth-child(2) { transform: translateY(-11px); transition-delay: 0.04s; }  /* I (narrow — tall bar) */
    .wm-dizzie:hover span:nth-child(3) { transform: translateY(-4px);  transition-delay: 0.02s; }  /* Z */
    .wm-dizzie:hover span:nth-child(4) { transform: translateY(-9px);  transition-delay: 0.06s; }  /* Z */
    .wm-dizzie:hover span:nth-child(5) { transform: translateY(-12px); transition-delay: 0.03s; }  /* I (narrow — tall bar) */
    .wm-dizzie:hover span:nth-child(6) { transform: translateY(-5px);  transition-delay: 0.05s; }  /* E */

    .wm-mark {
      display: block;
      font-family: Georgia, serif;
      font-size: 32px;
      color: #ede8dc;
      opacity: 0.32;
      margin-top: 14px;
      transition: opacity 0.3s ease;
    }
    .wm-inner:hover .wm-mark { opacity: 0.55; }

    /* ============================================================
       REDUCED MOTION
    ============================================================ */
    @media (prefers-reduced-motion: reduce) {
      .text-content { opacity: 1 !important; animation: none !important; transform: none !important; }
      .badge-ring   { stroke-dashoffset: 0 !important; animation: none !important; }
      .logo-label, .wm-inner { opacity: 1 !important; animation: none !important; }
      .wm-dizzie span { transition: none !important; }
      .badge-panel svg { transition: none !important; }
    }
  </style>
</head>
<body>

<!-- Grain: full-page fixed noise texture -->
<div class="grain" aria-hidden="true">
  <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <filter id="pg">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#pg)" opacity="0.09"/>
  </svg>
</div>

<!-- Badge colorways: dark | light -->
<div class="badge-split">

  <div class="badge-panel badge-dark" id="panel-dark">
    <span class="panel-label panel-label-dark">Primary</span>
    <div class="logo-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="320" height="320">
        <!--
          Entrance order:
          1. text-content emerges (0.08s) — the name materialises
          2. badge-ring draws clockwise from 12 o'clock (0.55s) — it gets sanctified

          Parallax: JS moves layer-saint / layer-dizzie / layer-mark
          at different rates, creating physical depth on hover.
        -->
        <g class="text-content">
          <g class="layer-saint">
            <text x="250" y="155" class="saint-text" text-anchor="middle" fill="#ede8dc">SAINT</text>
          </g>
          <g class="layer-dizzie">
            <text x="250" y="304" class="dizzie-text" text-anchor="middle" fill="#ede8dc">DIZZIE</text>
          </g>
          <g class="layer-mark">
            <text x="250" y="380" class="mark-text" text-anchor="middle" fill="#ede8dc" opacity="0.58">†</text>
          </g>
        </g>
        <circle class="badge-ring" cx="250" cy="250" r="222" fill="none" stroke="#ede8dc" stroke-width="8"/>
      </svg>
      <span class="logo-label logo-label-dark">Dark</span>
    </div>
  </div>

  <div class="badge-panel badge-light" id="panel-light">
    <span class="panel-label panel-label-light">Inverse</span>
    <div class="logo-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="320" height="320">
        <g class="text-content">
          <g class="layer-saint">
            <text x="250" y="155" class="saint-text" text-anchor="middle" fill="#111318">SAINT</text>
          </g>
          <g class="layer-dizzie">
            <text x="250" y="304" class="dizzie-text" text-anchor="middle" fill="#111318">DIZZIE</text>
          </g>
          <g class="layer-mark">
            <text x="250" y="380" class="mark-text" text-anchor="middle" fill="#111318" opacity="0.58">†</text>
          </g>
        </g>
        <circle class="badge-ring" cx="250" cy="250" r="222" fill="none" stroke="#111318" stroke-width="8"/>
      </svg>
      <span class="logo-label logo-label-light">Light</span>
    </div>
  </div>

</div>

<!-- Wordmark: no badge, pure typography with EQ lift -->
<section class="section-wm">
  <span class="wm-label">Wordmark</span>
  <div class="wm-inner">
    <span class="wm-saint">Saint</span>
    <span class="wm-dizzie" aria-label="DIZZIE">
      <span aria-hidden="true">D</span><span aria-hidden="true">I</span><span
        aria-hidden="true">Z</span><span aria-hidden="true">Z</span><span
        aria-hidden="true">I</span><span aria-hidden="true">E</span>
    </span>
    <span class="wm-mark">†</span>
  </div>
</section>

<script>
(function () {
  // Console easter egg — rewards developers who inspect the page
  try {
    console.log(
      '%c SAINT DIZZIE ',
      'font-size:20px;font-family:"Bebas Neue",Impact,sans-serif;' +
      'color:#0e0f14;background:#ede8dc;padding:6px 14px;letter-spacing:2px;'
    );
    console.log(
      '%c † Sanctified. Slick. Spare. ',
      'font-size:11px;font-family:Georgia,serif;color:#ede8dc;' +
      'letter-spacing:0.18em;opacity:0.6;'
    );
  } catch (_) {}

  const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (REDUCED) return;

  // ─── Mouse parallax + triple-click glitch ───────────────────────────────
  document.querySelectorAll('.badge-panel').forEach(function (panel) {
    var svg        = panel.querySelector('svg');
    var saintLayer = svg && svg.querySelector('.layer-saint');
    var dizzieLayer = svg && svg.querySelector('.layer-dizzie');
    var markLayer  = svg && svg.querySelector('.layer-mark');
    if (!saintLayer) return;

    var raf;

    panel.addEventListener('mousemove', function (e) {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(function () {
        var rect = svg.getBoundingClientRect();
        var x = (e.clientX - (rect.left + rect.width  * 0.5)) / (rect.width  * 0.5);
        var y = (e.clientY - (rect.top  + rect.height * 0.5)) / (rect.height * 0.5);

        // Three layers at different depths: SAINT furthest, DIZZIE closest
        var fast = 'transform 0.1s linear';
        saintLayer.style.transition  = fast;
        saintLayer.style.transform   = 'translate(' + (x * -8) + 'px,' + (y * -6) + 'px)';
        dizzieLayer.style.transition = fast;
        dizzieLayer.style.transform  = 'translate(' + (x * -3) + 'px,' + (y * -2) + 'px)';
        markLayer.style.transition   = fast;
        markLayer.style.transform    = 'translate(' + (x * -5) + 'px,' + (y * -4) + 'px)';
      });
    });

    panel.addEventListener('mouseleave', function () {
      cancelAnimationFrame(raf);
      var slow = 'transform 0.55s cubic-bezier(0.22,1,0.36,1)';
      [saintLayer, dizzieLayer, markLayer].forEach(function (el) {
        el.style.transition = slow;
        el.style.transform  = '';
      });
    });

    // Triple-click glitch: three rapid clicks within 600ms
    var clicks = 0, clickTimer;
    panel.addEventListener('click', function () {
      clicks++;
      clearTimeout(clickTimer);
      clickTimer = setTimeout(function () { clicks = 0; }, 600);
      if (clicks >= 3) {
        clicks = 0;
        panel.classList.add('glitching');
        panel.addEventListener('animationend', function () {
          panel.classList.remove('glitching');
        }, { once: true });
      }
    });
  });
})();
</script>

</body>
</html>
